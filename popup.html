<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 420px;
      min-height: 480px;
      background: #fafbfc;
      color: #1a1a2e;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 16px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .lang-toggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lang-toggle:hover { background: rgba(255,255,255,0.35); }
    .btn-export {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-export:hover { background: rgba(255,255,255,0.35); }

    /* Streak banner */
    .streak-banner {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #5a3e1b;
    }
    .streak-fire { font-size: 22px; line-height: 1; }
    .streak-info { flex: 1; }
    .streak-count {
      font-size: 18px;
      font-weight: 800;
      color: #c0392b;
    }
    .streak-label {
      font-size: 11px;
      font-weight: 600;
      color: #7a4a1a;
    }
    .streak-best {
      font-size: 10px;
      color: #9b6b3a;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #e8e8ef;
      padding: 0 12px;
    }
    .tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #8b8da3;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab:hover { color: #667eea; }
    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    /* Content area */
    .content {
      padding: 16px 20px;
    }

    /* Summary cards */
    .summary {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      flex: 1;
      background: #fff;
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid #eef0f5;
    }
    .card .num {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card .label {
      font-size: 11px;
      color: #8b8da3;
      margin-top: 2px;
      font-weight: 500;
    }

    /* Chart container */
    .chart-container {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid #eef0f5;
    }
    .chart-title {
      font-size: 11px;
      font-weight: 600;
      color: #8b8da3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
    }
    .chart-wrapper canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Table */
    .table-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid #eef0f5;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left;
      color: #8b8da3;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 14px;
      background: #fafbfc;
      border-bottom: 1px solid #eef0f5;
    }
    th:not(:first-child) { text-align: right; }
    td {
      padding: 9px 14px;
      border-bottom: 1px solid #f4f5f7;
    }
    td:not(:first-child) { text-align: right; color: #6b6d82; }
    tr:last-child td { border-bottom: none; }
    .domain {
      font-weight: 600;
      color: #1a1a2e;
    }
    .empty {
      text-align: center;
      color: #b5b7c9;
      font-size: 13px;
      padding: 24px 0;
    }

    /* Date label */
    .date-label {
      font-size: 11px;
      color: #8b8da3;
      margin-bottom: 14px;
    }

    /* Settings section */
    .settings-section {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .settings-title {
      font-size: 11px;
      font-weight: 600;
      color: #8b8da3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid #eef0f5;
      font-size: 12px;
      color: #6b6d82;
    }
    .setting-row label {
      font-weight: 600;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .setting-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .setting-input-group input {
      width: 60px;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      color: #1a1a2e;
      background: #fafbfc;
      text-align: center;
    }
    .setting-input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
    }
    .setting-unit {
      font-size: 11px;
      color: #8b8da3;
    }
    .btn-confirm, .btn-dismiss {
      border: none;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      padding: 0;
    }
    .btn-confirm {
      background: #27ae60;
      color: #fff;
    }
    .btn-dismiss {
      background: #e74c3c;
      color: #fff;
    }
    .btn-confirm:hover, .btn-dismiss:hover { opacity: 0.8; }

    .setting-saved {
      position: absolute;
      right: 0;
      top: -14px;
      font-size: 10px;
      color: #27ae60;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .setting-saved.show { opacity: 1; }

    /* Gear button */
    .btn-gear {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .btn-gear:hover { background: rgba(255,255,255,0.35); }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .modal-text {
      font-size: 12px;
      color: #6b6d82;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      line-height: 1;
      color: #8b8da3;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: #1a1a2e; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: #fff;
      color: #6b6d82;
      border: 1px solid #d8d9e3;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #f4f5f7; }

    .modal-card .settings-section { margin-top: 0; }

    .reset-area { margin-top: 12px; text-align: center; }
    .btn-reset {
      background: #fff;
      color: #e74c3c;
      border: 1px solid #e74c3c;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reset:hover { background: #fdecea; }
    .reset-confirm {
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: #fdecea;
      border-radius: 8px;
      border: 1px solid #f5c6cb;
    }
    .reset-confirm.show { display: flex; }
    .reset-warn { font-size: 12px; color: #c0392b; font-weight: 600; }
    .reset-actions { display: flex; gap: 8px; }
    .reset-area.confirming .btn-reset { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Video Tracker</h1>
    <div class="header-actions">
      <button class="btn-export" id="btn-export" title="Export CSV">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CSV
      </button>
      <button class="lang-toggle" id="lang-toggle">EN</button>
      <button class="btn-gear" id="btn-gear" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Streak banner -->
  <div class="streak-banner" id="streak-banner">
    <div class="streak-fire">&#128293;</div>
    <div class="streak-info">
      <span class="streak-count" id="streak-count">0</span>
      <span class="streak-label" data-i18n="streak_days">dias de streak</span>
      <br>
      <span class="streak-best" id="streak-best"></span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="today" data-i18n="tab_today">Hoje</button>
    <button class="tab" data-tab="7days" data-i18n="tab_7days">7 Dias</button>
    <button class="tab" data-tab="30days" data-i18n="tab_30days">30 Dias</button>
    <button class="tab" data-tab="alltime" data-i18n="tab_alltime">Tudo</button>
  </div>

  <div class="content">
    <p class="date-label" id="date-label"></p>

    <div class="summary">
      <div class="card">
        <div class="num" id="total-videos">0</div>
        <div class="label" data-i18n="videos">videos</div>
      </div>
      <div class="card">
        <div class="num" id="total-time">0m</div>
        <div class="label" data-i18n="watched">assistidos</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-title" data-i18n="chart_title">Tempo por periodo</div>
      <div class="chart-wrapper">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th data-i18n="site">Site</th>
            <th data-i18n="videos">Videos</th>
            <th data-i18n="time">Tempo</th>
          </tr>
        </thead>
        <tbody id="data-body"></tbody>
      </table>
    </div>

  </div>

  <!-- Onboarding modal -->
  <div class="modal-overlay" id="onboarding-modal">
    <div class="modal-card">
      <div class="modal-title" data-i18n="onboarding_title">Bem-vindo ao Video Tracker</div>
      <div class="modal-text" data-i18n="onboarding_text">Acompanhe seu tempo assistindo videos. Quer configurar limites diarios agora?</div>
      <div class="modal-actions">
        <button class="btn-secondary" id="onboarding-skip" data-i18n="onboarding_skip">Deixar para depois</button>
        <button class="btn-primary" id="onboarding-configure" data-i18n="onboarding_configure">Configurar agora</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
      <button class="modal-close" id="settings-close" title="Fechar">&times;</button>
      <div class="modal-title" data-i18n="settings_title">Configuracoes</div>
      <div class="settings-section">
      <!-- Notify interval -->
      <div class="setting-row">
        <label>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span data-i18n="notify_label">Notificar a cada</span>
        </label>
        <div class="setting-input-group">
          <input type="number" id="notify-interval" min="1" max="1440" value="60">
          <span class="setting-unit">min</span>
          <button class="btn-confirm" id="notify-confirm" title="Confirmar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="btn-dismiss" id="notify-dismiss" title="Cancelar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span class="setting-saved" id="notify-saved"></span>
        </div>
      </div>

      <!-- Max videos per day -->
      <div class="setting-row">
        <label>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <span data-i18n="max_videos_label">Max videos/dia</span>
        </label>
        <div class="setting-input-group">
          <input type="number" id="max-videos" min="0" max="9999" value="0">
          <span class="setting-unit" data-i18n="unit_videos">vid</span>
          <button class="btn-confirm" id="maxvid-confirm" title="Confirmar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="btn-dismiss" id="maxvid-dismiss" title="Cancelar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span class="setting-saved" id="maxvid-saved"></span>
        </div>
      </div>

      <!-- Max time per day -->
      <div class="setting-row">
        <label>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="max_time_label">Max tempo/dia</span>
        </label>
        <div class="setting-input-group">
          <input type="number" id="max-time" min="0" max="1440" value="0">
          <span class="setting-unit">min</span>
          <button class="btn-confirm" id="maxtime-confirm" title="Confirmar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button class="btn-dismiss" id="maxtime-dismiss" title="Cancelar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span class="setting-saved" id="maxtime-saved"></span>
        </div>
      </div>

      <div style="font-size:10px; color:#b5b7c9; text-align:center; margin-top:2px;">
        <span data-i18n="limits_hint">0 = sem limite</span>
      </div>

      <div class="reset-area" id="reset-area">
        <button class="btn-reset" id="btn-reset" data-i18n="reset_limits">Resetar limites</button>
        <div class="reset-confirm" id="reset-confirm">
          <span class="reset-warn" data-i18n="reset_confirm">Resetar todos os limites?</span>
          <div class="reset-actions">
            <button class="btn-secondary" id="reset-no" data-i18n="reset_no">Nao</button>
            <button class="btn-primary" id="reset-yes" data-i18n="reset_yes">Sim</button>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <script src="lib/chart.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
